version: "3.8"
services:
  vps-panel:
    build: .
    image: vps-panel:latest
    container_name: ziad-vps-panel
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - panel_data:/app/panel_data
    networks:
      - panel_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  panel_data:
    driver: local
networks:
  panel_network:
    driver: bridge
